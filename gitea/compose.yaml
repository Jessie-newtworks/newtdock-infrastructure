services:
  gitea:
    image: docker.gitea.com/gitea:28.4.0
    container_name: gitea
    restart: unless-stopped

    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__SSH_DOMAIN=192.168.2.193
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__ROOT_URL=http://192.168.2.193:3001/

# Gitea web interface and SSH access
    ports:
      - "3001:3000"
      - "2222:22"

    volumes:
      - ./data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
